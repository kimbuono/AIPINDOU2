services:
  backend:
    build: ./backend
    container_name: pindou-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8000
    container_name: pindou-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend
